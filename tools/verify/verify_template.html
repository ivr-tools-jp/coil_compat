<title>コイル適合 照合表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 1カラムの作業リスト。上部に進み具合と絞り込み、その下に製品ごとの照合カード（項目ごとに 一致／違う） */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface-2:#f6f8fa; --fg:#15212c; --muted:#5a6977; --line:#d5dde4;
  --accent:#0d6c8c; --accent-fg:#ffffff; --accent-soft:#dcedf3;
  --ok:#1d7f47; --ok-soft:#dff2e6; --warn:#a8650a; --warn-soft:#fbeed6; --ng:#6f7c88; --ng-soft:#e7ebef;
  --flag:#9b2c2c; --flag-soft:#f7e3e3;
  --font-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1318; --surface:#141f27; --surface-2:#1a2832; --fg:#e4ecf2; --muted:#93a3b2; --line:#26353f;
  --accent:#4fb0d0; --accent-fg:#06222c; --accent-soft:#16323d;
  --ok:#4cc27f; --ok-soft:#13301f; --warn:#e8a33a; --warn-soft:#352612; --ng:#7d8b98; --ng-soft:#1d2830;
  --flag:#ef8a8a; --flag-soft:#3a1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1318; --surface:#141f27; --surface-2:#1a2832; --fg:#e4ecf2; --muted:#93a3b2; --line:#26353f;
  --accent:#4fb0d0; --accent-fg:#06222c; --accent-soft:#16323d;
  --ok:#4cc27f; --ok-soft:#13301f; --warn:#e8a33a; --warn-soft:#352612; --ng:#7d8b98; --ng-soft:#1d2830;
  --flag:#ef8a8a; --flag-soft:#3a1c1c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.save{font-size:12px;color:var(--muted)}
.save.err{color:var(--flag);font-weight:700}
.bar{margin-top:8px;height:8px;border-radius:99px;background:var(--ng-soft);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-fix{background:var(--flag)} .bar .b-part{background:var(--warn)}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.counts b{font-family:var(--font-num);color:var(--fg)}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.f{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;min-height:36px}
.f[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.howto{margin-top:12px;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.howto ol{margin:4px 0 0;padding-left:1.3em}
.howto b{color:var(--fg)}

h2.sec{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:22px 0 8px;font-weight:700}
.list{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card[data-st="done"]{border-color:var(--ok)}
.card[data-st="fix"]{border-color:var(--flag)}
.chead{padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.trow{display:flex;gap:10px;align-items:flex-start}
.tt{min-width:0;flex:1}
.tt .name{font-weight:700;font-size:16px;line-height:1.35}
.tt .maker{font-size:12.5px;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.todo{background:var(--ng-soft);color:var(--ng)}
.pill.part{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.fix{background:var(--flag-soft);color:var(--flag)}
.src{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.src .where{color:var(--fg)}
.src .where::before{content:"見る場所　";color:var(--muted);font-size:11px;letter-spacing:.05em}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.links a{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:8px;padding:5px 10px}
.links a::after{content:" ↗"}
.links .loc{font-size:12px;color:var(--muted);padding:5px 0}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}

.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 14px;border-top:1px solid var(--line);align-items:center}
.it:first-child{border-top:0}
.it .lab{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.it .val{font-size:14.5px;overflow-wrap:anywhere}
.it .val.empty{color:var(--muted);font-style:normal}
.it[data-s="ok"]{background:color-mix(in srgb,var(--ok-soft) 55%,transparent)}
.it[data-s="ng"]{background:color-mix(in srgb,var(--flag-soft) 60%,transparent)}
.btns{display:flex;gap:6px}
.b{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:58px;min-height:38px;padding:4px 10px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.b.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.b.ng[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:var(--surface)}
.ai{grid-column:1 / -1;font-size:12px;color:var(--muted)}
.ai b{font-weight:700}
.ai.mismatch{color:var(--flag)} .ai.fixed{color:var(--accent)} .ai.not_found{color:var(--warn)}
.fixin{grid-column:1 / -1;display:flex;gap:8px;align-items:center}
.fixin label{font-size:12px;color:var(--flag);white-space:nowrap}
.fixin input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--flag);border-radius:8px;background:var(--surface)}

.cfoot{display:flex;flex-direction:column;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.cfoot .row{display:flex;gap:8px;flex-wrap:wrap}
.allok{border:1px solid var(--ok);color:var(--ok);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;min-height:38px}
.clear{border:1px solid var(--line);color:var(--muted);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:38px}
.cfoot textarea{width:100%;min-height:2.6em;resize:vertical;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.empty-list{color:var(--muted);font-size:14px;padding:16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>コイル適合 照合表</h1><span class="save" id="save">接続中…</span></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="counts" id="counts"></div>
    <div class="filters" role="group" aria-label="絞り込み">
      <button class="f" data-f="all" aria-pressed="true" id="f-all">すべて</button>
      <button class="f" data-f="todo" aria-pressed="false" id="f-todo">未着手・途中</button>
      <button class="f" data-f="fix" aria-pressed="false" id="f-fix">要修正</button>
      <button class="f" data-f="done" aria-pressed="false" id="f-done">照合済み</button>
      <button class="f" data-f="ai" aria-pressed="false" id="f-ai" hidden>AI が不一致・未確認</button>
    </div>
  </header>

  <div class="howto">
    <b>使い方</b>
    <ol>
      <li>「添付文書（PMDA）」などのボタンで原本を開き、「見る場所」を確かめる。</li>
      <li>値が原本と同じなら <b>一致</b>。違えば <b>違う</b> を押して正しい値を書く。原本にも記載が無い空欄は一致でかまいません。</li>
      <li>押した内容はその場で保存されます。全項目が一致の製品を Claude が照合済み（verified=1）にし、違う所は CSV を直します。</li>
    </ol>
  </div>

  <h2 class="sec" id="h-coil">コイル</h2>
  <div class="list" id="l-coil"></div>
  <h2 class="sec" id="h-cat">マイクロカテーテル</h2>
  <div class="list" id="l-cat"></div>
</div>

<script>
const ROWS = /*__DATA__*/[];
const state = {};        // id -> {f:{key:"ok"|"ng"}, fix:{key:text}, memo:text}
let db = null, filter = "all";
const $ = (s, el = document) => el.querySelector(s);

function st(r) {
  const s = state[r.id] || {f: {}};
  const v = r.items.map(i => s.f?.[i.k]);
  if (v.some(x => x === "ng")) return "fix";
  if (v.every(x => x === "ok")) return "done";
  if (v.some(x => x)) return "part";
  return "todo";
}
const PILL = {todo: "未着手", part: "途中", done: "照合済み", fix: "要修正"};

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
}

function buildCard(r) {
  const card = el("article", {class: "card", id: "c-" + r.id});
  const links = el("div", {class: "links"});
  for (const [t, u] of r.links) links.append(el("a", {href: u, target: "_blank", rel: "noopener", text: t}));
  for (const t of r.local) links.append(el("span", {class: "loc", text: t}));
  const head = el("div", {class: "chead"},
    el("div", {class: "trow"},
      el("div", {class: "tt"}, el("div", {class: "name", text: r.title}), el("div", {class: "maker", text: r.maker})),
      el("span", {class: "pill todo", "data-pill": ""})),
    el("div", {class: "src"},
      el("div", {text: `${r.src}：${r.ref}`}),
      r.hint ? el("div", {class: "where", text: r.hint}) : null,
      links),
    r.note ? el("div", {class: "note", text: r.note}) : null);
  const items = el("div", {class: "items"});
  for (const i of r.items) {
    const fid = `${r.id}__${i.k}`;
    const row = el("div", {class: "it", "data-k": i.k},
      el("div", {}, el("div", {class: "lab", text: i.label}),
        el("div", {class: "val num" + (i.v ? "" : " empty"), text: i.v || "（空欄）"})),
      el("div", {class: "btns"},
        el("button", {class: "b ok", "aria-pressed": "false", "data-act": "ok", id: "ok-" + fid, text: "一致"}),
        el("button", {class: "b ng", "aria-pressed": "false", "data-act": "ng", id: "ng-" + fid, text: "違う"})));
    const fx = el("div", {class: "fixin", hidden: ""},
      el("label", {for: "fx-" + fid, text: "正しい値"}),
      el("input", {id: "fx-" + fid, type: "text", placeholder: "原本の値・ページ", "data-fix": i.k}));
    if (i.ai) {
      const lab = {match: "一致", mismatch: "不一致", not_found: "原本で見つからず", fixed: "不一致 → CSV を修正済み"}[i.ai.s] || i.ai.s;
      const where = [i.ai.file, i.ai.p ? "p" + i.ai.p : ""].filter(Boolean).join(" ");
      const extra = (i.ai.s === "match" || i.ai.s === "fixed") ? "" : [i.ai.src && "原本：" + i.ai.src, where, i.ai.note].filter(Boolean).join("／");
      const a = el("div", {class: "ai " + i.ai.s});
      a.append("AI 再確認：", el("b", {text: lab}), extra ? "　" + extra : "");
      row.append(a);
    }
    row.append(fx);
    items.append(row);
  }
  const foot = el("div", {class: "cfoot"},
    el("div", {class: "row"},
      el("button", {class: "allok", "data-act": "allok", id: "all-" + r.id, text: "すべて一致"}),
      el("button", {class: "clear", "data-act": "clear", id: "clr-" + r.id, text: "やり直す"})),
    el("textarea", {id: "memo-" + r.id, placeholder: "メモ（気づいたこと・原本のページなど）", "data-memo": ""}));
  card.append(head, items, foot);

  card.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const s = cur(r.id), act = b.dataset.act;
    if (act === "allok") { for (const i of r.items) s.f[i.k] = "ok"; s.fix = {}; }
    else if (act === "clear") { s.f = {}; s.fix = {}; }
    else {
      const k = b.closest(".it").dataset.k;
      s.f[k] = s.f[k] === act ? null : act;
      if (s.f[k] !== "ng") delete s.fix[k];
      if (s.f[k] === null) delete s.f[k];
    }
    paint(r); save(r.id);
    if (act === "ng" && s.f[b.closest(".it").dataset.k] === "ng") b.closest(".it").querySelector("input").focus();
  });
  card.addEventListener("change", e => {
    const s = cur(r.id);
    if (e.target.dataset.fix) s.fix[e.target.dataset.fix] = e.target.value.trim();
    else if (e.target.hasAttribute("data-memo")) s.memo = e.target.value;
    else return;
    save(r.id);
  });
  return card;
}

function cur(id) {
  const s = state[id] || (state[id] = {f: {}, fix: {}, memo: ""});
  s.f ||= {}; s.fix ||= {}; return s;
}

function paint(r) {
  const card = document.getElementById("c-" + r.id); if (!card) return;
  const s = state[r.id] || {f: {}, fix: {}, memo: ""}, status = st(r);
  card.dataset.st = status;
  const p = card.querySelector("[data-pill]"); p.className = "pill " + status; p.textContent = PILL[status];
  for (const row of card.querySelectorAll(".it")) {
    const k = row.dataset.k, v = s.f?.[k] || "";
    row.dataset.s = v;
    row.querySelector(".b.ok").setAttribute("aria-pressed", v === "ok");
    row.querySelector(".b.ng").setAttribute("aria-pressed", v === "ng");
    const fx = row.querySelector(".fixin"), inp = fx.querySelector("input");
    fx.hidden = v !== "ng";
    if (document.activeElement !== inp) inp.value = s.fix?.[k] || "";
  }
  const m = card.querySelector("textarea");
  if (document.activeElement !== m) m.value = s.memo || "";
  const aiFlag = r.items.some(i => i.ai && i.ai.s !== "match");
  card.hidden = !(filter === "all" || (filter === "ai" ? aiFlag : filter === "todo" ? (status === "todo" || status === "part") : status === filter));
}

function paintAll() {
  for (const r of ROWS) paint(r);
  const c = {todo: 0, part: 0, done: 0, fix: 0};
  for (const r of ROWS) c[st(r)]++;
  const n = ROWS.length, pct = x => (100 * x / n) + "%";
  const bar = $("#bar"); bar.replaceChildren(
    el("i", {class: "b-ok", style: "width:" + pct(c.done)}),
    el("i", {class: "b-fix", style: "width:" + pct(c.fix)}),
    el("i", {class: "b-part", style: "width:" + pct(c.part)}));
  $("#counts").innerHTML = "";
  for (const [lab, v] of [["照合済み", c.done], ["要修正", c.fix], ["途中", c.part], ["未着手", c.todo], ["全", n]]) {
    const s = el("span"); s.append(lab + " ", el("b", {text: v})); $("#counts").append(s);
  }
  for (const k of ["coil", "cat"]) {
    const vis = [...document.querySelectorAll(`#l-${k} .card`)].some(c => !c.hidden);
    let e = document.getElementById("e-" + k);
    if (!vis && !e) { e = el("div", {class: "empty-list", id: "e-" + k, text: "この条件に当てはまる製品はありません"}); $("#l-" + k).append(e); }
    if (vis && e) e.remove();
  }
}

// 保存：1つの製品につき1文書（checks/<id>）。同じ文書への書き込みは順番に1つずつ。
const queue = {};
let lastSaved = "";
function save(id) {
  paintAll();
  if (!db) { setSave("保存できません（ログインして開き直してください）", true); return; }
  const s = cur(id);
  const body = {f: Object.fromEntries(Object.entries(s.f).filter(([, v]) => v)), fix: s.fix, memo: s.memo || "", at: new Date().toISOString()};
  setSave("保存中…");
  queue[id] = (queue[id] || Promise.resolve()).then(() => db.doc("checks/" + id).set(body))
    .then(() => { lastSaved = new Date().toLocaleTimeString("ja-JP", {hour: "2-digit", minute: "2-digit"}); setSave("保存しました " + lastSaved); })
    .catch(e => setSave(e?.code === "invalid_argument" ? "この表示では保存できません（編集権限がありません）" : "保存できませんでした。もう一度押してください", true));
}
function setSave(t, err = false) { const e = $("#save"); e.textContent = t; e.classList.toggle("err", err); }

document.querySelectorAll(".f").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".f").forEach(x => x.setAttribute("aria-pressed", x === b));
  paintAll();
}));

for (const r of ROWS) $(r.kind === "coil" ? "#l-coil" : "#l-cat").append(buildCard(r));
if (ROWS.some(r => r.items.some(i => i.ai))) $("#f-ai").hidden = false;
paintAll();

(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { setSave("保存できません（ログインして開き直してください）", true); return; }
  setSave("読み込み中…");
  db.collection("checks").onSnapshot(snap => {
    for (const d of snap.docs) {
      const v = d.data(); if (!v) continue;
      state[d.id] = {f: {...(v.f || {})}, fix: {...(v.fix || {})}, memo: v.memo || ""};
    }
    paintAll();
    if (!lastSaved) setSave(snap.empty ? "接続しました（まだ保存はありません）" : `接続しました（保存済み ${snap.size} 製品）`);
  }, () => setSave("同期が切れました。ページを開き直してください", true));
})();
</script>
